plugins { id 'com.android.application' }
android {
    namespace 'com.forgex'
    compileSdk 35
    defaultConfig { applicationId 'com.forgex'; minSdk 28; targetSdk 28; versionCode 2; versionName '0.2.0'; testInstrumentationRunner 'dev.forge.ide.NativeInputInstrumentation' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
    signingConfigs {
        local {
            if (System.getenv('GCC_STUDIO_KEYSTORE')) {
                storeFile file(System.getenv('GCC_STUDIO_KEYSTORE'))
                storePassword System.getenv('GCC_STUDIO_KEY_PASSWORD')
                keyAlias 'forge'
                keyPassword System.getenv('GCC_STUDIO_KEY_PASSWORD')
            }
        }
    }
    androidResources { noCompress += ['zip'] }
    // Directly installed compiler host: target 28 is required for executing generated
    // binaries from app-private storage. This project is not published through Play.
    // Keep all other release lint checks enabled; see docs/BUILDING.md.
    lint { disable 'ExpiredTargetSdkVersion' }
    buildTypes {
        debug { if (System.getenv('GCC_STUDIO_KEYSTORE')) signingConfig signingConfigs.local }
        release { minifyEnabled false; if (System.getenv('GCC_STUDIO_KEYSTORE')) signingConfig signingConfigs.local }
    }
}
dependencies {
    implementation 'io.github.rosemoe:editor:0.24.4'
    testImplementation 'junit:junit:4.13.2'
}
