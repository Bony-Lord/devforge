name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'
          log-accepted-android-sdk-licenses: false
      - name: JavaScript syntax and protocol parser
        run: |
          for f in app/src/main/assets/ui/*.js; do node --check "$f"; done
          node tests/protocol.test.cjs
          node tests/native-editor-state.test.cjs
          node tests/interaction.test.cjs
          node tests/completion-keys.test.cjs
          node tests/dock-layout.test.cjs
          node tests/run-profiles.test.cjs
      - name: Python syntax
        run: python -m compileall -q tools tests
      - name: License inventory and notices
        run: python tools/check_licenses.py
      - name: Real host clang-format behavior
        run: |
          python -m pip install --target build/test-tools clang-format==21.1.8 --no-deps
          python tests/formatter_host_checks.py --binary build/test-tools/clang_format/data/bin/clang-format
      - name: Smart typing and lossless file encoding
        run: |
          mkdir -p build/core-checks
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/dev/forge/ide/{SmartTyping,FileCodec,FileTemplates,IndentGuides}.java tests/java/dev/forge/ide/{SmartTypingTest,FileCodecTest,FileTemplatesTest,IndentGuidesTest}.java
          java -cp build/core-checks dev.forge.ide.SmartTypingTest
          java -cp build/core-checks dev.forge.ide.FileCodecTest
          java -cp build/core-checks dev.forge.ide.FileTemplatesTest
          java -cp build/core-checks dev.forge.ide.IndentGuidesTest
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/dev/forge/ide/PackDownload.java tests/java/dev/forge/ide/PackDownloadTest.java
          java -cp build/core-checks dev.forge.ide.PackDownloadTest
      - name: Compile Android Java host
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac :app:testDebugUnitTest --console=plain
