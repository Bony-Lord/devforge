name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - name: JavaScript syntax and protocol parser
        run: |
          for f in app/src/main/assets/ui/*.js; do node --check "$f"; done
          node tests/protocol.test.cjs
          node tests/debugger-start.test.cjs
          node tests/native-editor-state.test.cjs
          node tests/interaction.test.cjs
          node tests/web-keyboard.test.cjs
          node tests/cell-editing.test.cjs
          node tests/completion-keys.test.cjs
          node tests/dock-layout.test.cjs
          node tests/run-profiles.test.cjs
          node tests/output-buffer.test.cjs
          node tests/addon-core.test.cjs
          node tests/addon-packages.test.cjs
          node tests/addon-host.test.cjs
          node tests/setup-model.test.cjs
          node tests/addon-selection.test.cjs
          node tests/notebook-model.test.cjs
          node --test tests/python-style-model.test.cjs tests/project-templates.test.cjs tests/project-paths.test.cjs tests/editor-lifecycle.test.cjs
          node tests/project-policy.test.cjs
          node tests/project-actions.test.cjs
          python tests/python_kernel_test.py
          python tests/python_style_test.py
          python tests/component-runtime.test.py
      - name: Python syntax
        run: python -m compileall -q tools tests
      - name: License inventory and notices
        run: python tools/check_licenses.py
      - name: Real host clang-format behavior
        run: |
          python -m pip install --target build/test-tools clang-format==21.1.8 --no-deps
          python tests/formatter_host_checks.py --binary build/test-tools/clang_format/data/bin/clang-format
      - name: Smart typing and lossless file encoding
        run: |
          mkdir -p build/core-checks
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/dev/forge/ide/{SmartTyping,FileCodec,FileTemplates,IndentGuides,HardwareLayout,SnapshotFile}.java tests/java/dev/forge/ide/{SmartTypingTest,FileCodecTest,FileTemplatesTest,IndentGuidesTest,HardwareLayoutTest,SnapshotFileTest}.java
          java -cp build/core-checks dev.forge.ide.SmartTypingTest
          java -cp build/core-checks dev.forge.ide.FileCodecTest
          java -cp build/core-checks dev.forge.ide.FileTemplatesTest
          java -cp build/core-checks dev.forge.ide.IndentGuidesTest
          java -cp build/core-checks dev.forge.ide.HardwareLayoutTest
          java -cp build/core-checks dev.forge.ide.SnapshotFileTest
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/dev/forge/ide/PackDownload.java tests/java/dev/forge/ide/PackDownloadTest.java
          java -cp build/core-checks dev.forge.ide.PackDownloadTest
      - name: Check workspace trust and third-party download boundaries
        run: |
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/dev/forge/ide/{AddonDownload,WorkspaceTrustPolicy}.java tests/java/dev/forge/ide/{AddonDownloadTest,WorkspaceTrustPolicyTest}.java
          java -cp build/core-checks dev.forge.ide.AddonDownloadTest
          java -cp build/core-checks dev.forge.ide.WorkspaceTrustPolicyTest
      - name: Compile Android Java host
        run: |
          chmod +x gradlew
          ./gradlew :app:compileCompatDebugJavaWithJavac :app:testCompatDebugUnitTest --console=plain
