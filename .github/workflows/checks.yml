name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and protocol parser
        run: |
          for f in app/src/main/assets/ui/*.js; do node --check "$f"; done
          node tests/protocol.test.cjs
      - name: Python syntax
        run: python -m compileall -q tools tests
      - name: Compile Android Java host
        run: |
          sdkmanager 'platforms;android-35'
          mkdir -p work/classes
          javac -source 8 -target 8 -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d work/classes $(find app/src/main/java -name '*.java')
