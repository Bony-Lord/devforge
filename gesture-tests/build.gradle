plugins { id 'com.android.test' }
android {
    namespace 'dev.forge.ide.gestures'
    compileSdk 36
    targetProjectPath ':app'
    defaultConfig { minSdk 28; targetSdk 36; missingDimensionStrategy 'runtime', 'modern'; testApplicationId 'com.forgex.gesturetests'; testInstrumentationRunner 'dev.forge.ide.NativeInputInstrumentation' }
    sourceSets { main { java.srcDirs = ['../app/src/androidTest/java'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        local {
            if (System.getenv('GCC_STUDIO_KEYSTORE')) {
                storeFile file(System.getenv('GCC_STUDIO_KEYSTORE'))
                storePassword System.getenv('GCC_STUDIO_KEY_PASSWORD')
                keyAlias 'forge'
                keyPassword System.getenv('GCC_STUDIO_KEY_PASSWORD')
            }
        }
    }
    buildTypes { debug { if (System.getenv('GCC_STUDIO_KEYSTORE')) signingConfig signingConfigs.local } }
}
dependencies { compileOnly 'io.github.rosemoe:editor:0.24.4' }
