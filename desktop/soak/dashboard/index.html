<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DevForge · Финдеры</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
 <aside class="sidebar"><a class="brand" href="#runs"><span class="brand-symbol">⌁</span><span>DevForge<small>Финдеры</small></span></a><nav aria-label="Разделы">
  <button data-view="runs" class="nav active"><span>◉</span> Активные <b id="active-count">0</b></button>
  <button data-view="findings" class="nav"><span>▧</span> Находки <b id="finding-count"></b></button>
  <button data-view="history" class="nav"><span>◷</span> История</button>
 </nav><div class="sidebar-bottom"><button class="quiet" data-action="import">＋ Папка отчётов</button><span id="connection">Подключение…</span></div></aside>
 <main><header class="page-header"><div><p class="eyebrow">DEVFORGE / ПРОВЕРКИ</p><h1 id="page-title">Активные запуски</h1></div><div class="header-actions"><button id="stop-all" class="quiet danger" data-action="stop-all">Остановить все</button><button class="primary" data-action="new">＋ Новый запуск</button></div></header>
  <div id="error-banner" class="error-banner" hidden></div><section id="stats" class="stats" aria-label="Показатели"></section>
  <section id="workspace"><div class="toolbar"><div class="segmented" aria-label="Тип финдера"><button data-focus="all" class="selected">Все</button><button data-focus="general">Общие</button><button data-focus="vsx">VSX</button></div><span id="run-caption"></span></div><div id="run-list" class="run-list"></div></section>
  <section id="findings-view" hidden><form id="finding-filters" class="finding-filters"><input name="q" type="search" placeholder="Поиск по находкам" aria-label="Поиск по находкам"><select name="run" aria-label="Запуск"><option value="">Все запуски</option></select><select name="kind" aria-label="Тип находки"><option value="">Все типы</option><option value="bug">Ошибки</option><option value="visual">Оформление</option><option value="resource">Ресурсы</option><option value="adapter">Адаптер</option><option value="infrastructure">Запуск и окружение</option></select><select name="review" aria-label="Отметка"><option value="">Все отметки</option><option value="needs-review">Нужно проверить</option><option value="confirmed">Подтверждены</option><option value="fixed">Исправлены</option><option value="dismissed">Не ошибка</option><option value="later">Отложены</option></select></form><p id="findings-caption" class="caption"></p><div id="finding-list"></div><button id="load-more" class="quiet" hidden>Показать ещё</button></section>
 </main>
 <dialog id="run-dialog" class="modal"><form id="run-form"><header><div><p class="eyebrow" id="form-eyebrow">НОВЫЙ ЗАПУСК</p><h2 id="form-title">Настроить проверку</h2></div><button type="button" class="icon-button" data-close="run-dialog" aria-label="Закрыть">×</button></header>
  <div id="legacy-note" class="notice" hidden>Этот запуск применяет настройки через перезапуск. Его отчёты сохранятся.</div>
  <div class="form-grid"><label>Название<input name="name" placeholder="Название проверки"></label><label>Финдер<select name="focus"><option value="general">Общий финдер</option><option value="vsx">VSX финдер</option></select></label>
  <label>Режим нагрузки<select name="performance"><option value="normal">Обычный</option><option value="idle">При простое ПК</option><option value="full">Полная мощность</option></select></label><label id="duration-field">Продолжительность, ч<input name="hours" type="number" min="0.01" max="168" step="0.01" value="2"></label>
  <label>Общий порог памяти, ГБ<input name="memory" type="number" min="0.5" step="0.5" value="4" required></label><label>Потоков, максимум<input name="workers" type="number" min="1" max="32" value="1" required></label>
  <label>Память на поток, ГБ<input name="workerMemory" type="number" min="0.5" step="0.5" value="4" required></label><label>Отчёты, МБ<input name="disk" type="number" min="64" step="64" value="1024" required></label></div>
  <details class="advanced"><summary>Дополнительные параметры</summary><div class="form-grid"><label>Резерв памяти для системы, ГБ<input name="reserve" type="number" min="1" step="0.5" value="6"></label><label>Пауза между действиями, мс<input name="delay" type="number" min="0" max="10000" step="50" value="450"></label><label class="new-only">Набор проверок<select name="suite"><option value="">Случайные сценарии + наборы</option></select></label><label class="new-only">Seed<input name="seed" placeholder="Автоматически"></label><label class="wide new-only">Приложение<input name="app" placeholder="Путь к DevForge.exe"></label><label class="check new-only"><input name="regressions" type="checkbox" checked> Подключать наборы проверок</label><label class="check new-only"><input name="keepAwake" type="checkbox" checked> Не давать ПК уснуть во время проверки</label></div></details>
  <div id="form-error" class="form-error" role="alert"></div><footer><button type="button" class="quiet" data-close="run-dialog">Отмена</button><button type="submit" class="primary" id="form-submit">Запустить</button></footer>
 </form></dialog>
 <dialog id="finding-dialog" class="drawer"><header><div><p class="eyebrow" id="detail-kind">НАХОДКА</p><h2 id="detail-title"></h2></div><button class="icon-button" data-close="finding-dialog" aria-label="Закрыть находку">×</button></header><div id="detail-body"></div></dialog>
 <dialog id="import-dialog" class="modal small"><form id="import-form"><header><h2>Добавить отчёты</h2><button type="button" class="icon-button" data-close="import-dialog" aria-label="Закрыть">×</button></header><label>Папка с запусками<input name="path" placeholder="D:\DevForgeTests" required></label><label>Название<input name="name" placeholder="Мои проверки"></label><div class="form-error" id="import-error"></div><footer><button type="button" class="quiet" data-close="import-dialog">Отмена</button><button class="primary">Добавить</button></footer></form></dialog>
 <div id="toast" class="toast" role="status" hidden></div>
</body></html>
